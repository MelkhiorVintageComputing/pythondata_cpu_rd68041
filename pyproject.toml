[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythondata-cpu-rd68041"
version = "0.0"
description = "Python module containing the SystemVerilog files of the RD68041 (MC68040 / MC68LC040) CPU"
license = {text = "CERN-OHL-S-2.0"}

[tool.setuptools.packages.find]
include = ["pythondata_cpu_rd68041"]

[tool.setuptools.package-data]
pythondata_cpu_rd68041 = ["verilog/**/*"]
